<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA Tracker — 840 Problems</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507;--bg2:#09090d;--bg3:#0e0e15;--bg4:#13131c;--bg5:#181824;
  --b1:#1c1c28;--b2:#242432;--b3:#2e2e40;--b4:#3a3a50;
  --t1:#f0f0ff;--t2:#a0a0c0;--t3:#606080;--t4:#383850;
  --purple:#8b5cf6;--blue:#3b82f6;--cyan:#06b6d4;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;
  --easy:#10b981;--med:#f59e0b;--hard:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:"Outfit",sans-serif;overflow-x:hidden;min-height:100vh}

/* ── ANIMATED BG ── */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(139,92,246,.07) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 90% 100%,rgba(6,182,212,.05) 0%,transparent 60%),
             radial-gradient(ellipse 50% 40% at 50% 50%,rgba(59,130,246,.03) 0%,transparent 70%);}

/* ── PARTICLES ── */
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p-dot{position:absolute;border-radius:50%;animation:floatP linear infinite;opacity:0}
@keyframes floatP{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.6}90%{opacity:.2}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}

.app{position:relative;z-index:1}

/* ── HERO ── */
.hero{padding:40px 20px 28px;text-align:center;border-bottom:1px solid var(--b1);position:relative;overflow:hidden}
.hero-glow{position:absolute;top:-120px;left:50%;transform:translateX(-50%);
  width:700px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.1) 0%,transparent 65%);pointer-events:none}

.eyebrow{display:inline-flex;align-items:center;gap:6px;
  background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);
  border-radius:20px;padding:4px 14px;
  font-size:11px;font-weight:600;color:#c4b5fd;
  font-family:"JetBrains Mono",monospace;letter-spacing:.1em;margin-bottom:18px;
  animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.hero-title{font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:-1.5px;margin-bottom:10px;line-height:1.08;
  background:linear-gradient(135deg,#fff 0%,#c4b5fd 35%,#38bdf8 65%,#34d399 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:14px;color:var(--t3);margin-bottom:28px}

/* XP BAR */
.xp-wrap{max-width:520px;margin:0 auto 24px;padding:0 4px}
.xp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xp-lbl{font-size:11px;color:var(--t3);font-family:"JetBrains Mono",monospace}
.xp-val{font-size:12px;font-weight:700;color:#a78bfa;font-family:"JetBrains Mono",monospace}
.xp-track{height:8px;background:var(--b1);border-radius:8px;overflow:visible;border:1px solid var(--b2);position:relative}
.xp-fill{height:100%;border-radius:8px;
  background:linear-gradient(90deg,#7c3aed,#2563eb,#0891b2,#059669);background-size:200% 100%;
  animation:shimmer 3s linear infinite;transition:width .8s cubic-bezier(.4,0,.2,1);min-width:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.xp-dot{position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle,#a78bfa,#38bdf8);
  box-shadow:0 0 0 3px rgba(167,139,250,.25),0 0 14px rgba(167,139,250,.7);
  transition:right .8s cubic-bezier(.4,0,.2,1)}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:680px;margin:0 auto}
.sc{background:var(--b1);border:1px solid var(--b2);border-radius:14px;padding:14px 8px;
  text-align:center;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;cursor:default}
.sc:hover{transform:translateY(-2px);border-color:var(--b3)}
.sc::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--sg,rgba(139,92,246,.1)) 0%,transparent 70%)}
.sc.tc{--sg:rgba(139,92,246,.12)}.sc.ec{--sg:rgba(16,185,129,.1)}.sc.mc{--sg:rgba(245,158,11,.1)}.sc.hc{--sg:rgba(239,68,68,.1)}.sc.dc{--sg:rgba(6,182,212,.1)}
.sc-num{font-size:22px;font-weight:800;font-family:"JetBrains Mono",monospace;line-height:1;
  transition:transform .3s}
.sc:hover .sc-num{transform:scale(1.1)}
.sc-lbl{font-size:10px;color:var(--t3);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sc.tc .sc-num{color:#a78bfa}.sc.ec .sc-num{color:var(--easy)}.sc.mc .sc-num{color:var(--med)}.sc.hc .sc-num{color:var(--hard)}.sc.dc .sc-num{color:var(--cyan)}

/* ── CONTROLS ── */
.controls{position:sticky;top:0;z-index:100;
  background:rgba(5,5,7,.94);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--b1);padding:10px 20px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cgrp{display:flex;gap:4px;flex-wrap:wrap}
.csep{width:1px;align-self:stretch;background:var(--b2);margin:0 4px}
.fb{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;
  padding:5px 11px;border-radius:7px;border:1px solid var(--b2);background:transparent;
  color:var(--t3);cursor:pointer;transition:all .15s;white-space:nowrap}
.fb:hover{background:var(--b2);color:var(--t2)}
.fb.on{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.45);color:#c4b5fd}
.fb.on.ef{background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.35);color:var(--easy)}
.fb.on.mf{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.35);color:var(--med)}
.fb.on.hf{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.35);color:var(--hard)}
.fb.on.sf{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.28);color:var(--easy)}
.fb.on.uf{background:rgba(148,163,184,.07);border-color:rgba(148,163,184,.18);color:var(--t2)}
.sw{flex:1;min-width:160px;position:relative}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:13px;pointer-events:none}
.si{width:100%;padding:6px 12px 6px 32px;background:var(--b1);border:1px solid var(--b2);
  border-radius:7px;color:var(--t1);font-family:"JetBrains Mono",monospace;font-size:12px;outline:none;transition:border-color .15s}
.si:focus{border-color:rgba(139,92,246,.45)}
.si::placeholder{color:var(--t4)}
.result-count{font-size:11px;color:var(--t3);font-family:"JetBrains Mono",monospace;white-space:nowrap}

/* ── MONTHS ── */
.months{padding:14px}
.mc{background:var(--bg2);border:1px solid var(--b1);border-radius:18px;
  margin-bottom:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s;
  animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.mc:nth-child(1){animation-delay:.05s}.mc:nth-child(2){animation-delay:.1s}
.mc:nth-child(3){animation-delay:.15s}.mc:nth-child(4){animation-delay:.2s}
.mc:nth-child(5){animation-delay:.25s}.mc:nth-child(6){animation-delay:.3s}
.mc.open{border-color:var(--b2);box-shadow:0 0 0 1px var(--b2),0 8px 32px rgba(0,0,0,.4)}

.mh{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;
  padding:16px 20px;cursor:pointer;user-select:none;transition:background .15s}
.mh:hover{background:rgba(255,255,255,.018)}

.micon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;position:relative}
.micon::after{content:"";position:absolute;inset:0;border-radius:14px;
  background:inherit;filter:blur(12px);opacity:.5;z-index:-1;transform:scale(.8) translateY(4px)}
.minfo{}
.mname{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbadge{font-size:10px;padding:1px 7px;border-radius:5px;font-weight:600;
  font-family:"JetBrains Mono",monospace;border:1px solid}
.mmeta{font-size:11px;color:var(--t3);font-family:"JetBrains Mono",monospace}

.mright{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mring{position:relative;width:48px;height:48px}
.mring svg{transform:rotate(-90deg)}
.rb{fill:none;stroke:var(--b2);stroke-width:4}
.rf{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.rinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rpct{font-size:10px;font-weight:700;font-family:"JetBrains Mono",monospace;line-height:1}
.rdone{font-size:9px;color:var(--t3);font-family:"JetBrains Mono",monospace}
.mtog{width:28px;height:28px;border-radius:7px;background:var(--b1);border:1px solid var(--b2);
  display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:11px;
  transition:all .22s;flex-shrink:0}
.mc.open .mtog{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.38);color:#c4b5fd;transform:rotate(180deg)}

.mb{display:none;padding:4px 8px 10px}
.mc.open .mb{display:block}

/* ── WEEKS ── */
.wc{background:var(--bg3);border:1px solid var(--b1);border-radius:13px;margin-bottom:7px;overflow:hidden}
.wh{display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;cursor:pointer;user-select:none;transition:background .12s}
.wh:hover{background:rgba(255,255,255,.02)}
.wleft{flex:1;min-width:0}
.wname{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px}
.wchips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;padding:2px 7px;border-radius:5px;
  background:var(--b1);border:1px solid var(--b2);color:var(--t3);font-family:"JetBrains Mono",monospace}
.dchip{border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.08);color:#a78bfa}
.wright{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:12px}
.wprog{width:70px}
.wpt{font-size:9px;color:var(--t3);font-family:"JetBrains Mono",monospace;text-align:right;margin-bottom:2px}
.wtrack{height:3px;background:var(--b1);border-radius:3px;overflow:hidden}
.wfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s}
.wchev{color:var(--t4);font-size:10px;transition:transform .2s;flex-shrink:0}
.wchev.open{transform:rotate(180deg)}
.wbody{display:none;padding:0 4px 4px}
.wbody.open{display:block}

/* ── PROBLEMS ── */
.pi{
  display:grid;grid-template-columns:28px 22px 1fr 70px 56px 32px;
  align-items:center;gap:6px;padding:8px 12px;border-radius:9px;
  cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative;
  text-decoration:none;color:inherit;
}
.pi:hover{background:rgba(255,255,255,.04);transform:translateX(3px)}
.pi.solved{background:rgba(16,185,129,.035)}
.pi.solved:hover{background:rgba(16,185,129,.065);transform:translateX(3px)}
.pi.hidden{display:none!important}
.pi.solved::before{content:"";position:absolute;left:0;top:25%;bottom:25%;
  width:2px;border-radius:2px;background:var(--easy);box-shadow:0 0 6px rgba(16,185,129,.5)}

/* Clicking glow effect */
.pi:active{transform:translateX(3px) scale(.99)}

.dn{font-size:10px;color:var(--t4);font-family:"JetBrains Mono",monospace;text-align:right}

.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--b3);background:transparent;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;pointer-events:none}
.chk.done{background:var(--easy);border-color:var(--easy);box-shadow:0 0 10px rgba(16,185,129,.4)}
.chk.done::after{content:"✓";font-size:11px;color:#000;font-weight:900;line-height:1}

.pn{font-size:12px;font-weight:500;color:var(--t2);transition:color .12s;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi:hover .pn{color:var(--t1)}
.pn.done{color:var(--t4);text-decoration:line-through;font-weight:400}

.psrc{font-size:9px;color:var(--t4);font-family:"JetBrains Mono",monospace;
  background:var(--b1);border:1px solid var(--b1);border-radius:4px;padding:2px 6px;white-space:nowrap}

.diff{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:600;
  font-family:"JetBrains Mono",monospace;text-align:center;white-space:nowrap}
.diff.easy{background:rgba(16,185,129,.1);color:var(--easy);border:1px solid rgba(16,185,129,.22)}
.diff.med{background:rgba(245,158,11,.1);color:var(--med);border:1px solid rgba(245,158,11,.22)}
.diff.hard{background:rgba(239,68,68,.1);color:var(--hard);border:1px solid rgba(239,68,68,.22)}

/* Open link icon - shown on row */
.plink{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;font-family:"JetBrains Mono",monospace;
  border:1px solid var(--b2);background:var(--b1);color:var(--t3);
  transition:all .15s;flex-shrink:0;text-decoration:none;}
.plink:hover{transform:scale(1.12) rotate(-5deg);}
.plink.lc:hover{background:rgba(255,161,22,.15);border-color:rgba(255,161,22,.5);color:#ffa116;
  box-shadow:0 4px 12px rgba(255,161,22,.25)}
.plink.gfg:hover{background:rgba(47,141,70,.15);border-color:rgba(47,141,70,.5);color:#2f8d46;
  box-shadow:0 4px 12px rgba(47,141,70,.25)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;z-index:999;
  background:linear-gradient(135deg,#065f46,#0e7490);
  border:1px solid rgba(16,185,129,.3);
  border-radius:14px;padding:12px 18px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 32px rgba(16,185,129,.2),0 0 0 1px rgba(16,185,129,.1);
  transform:translateY(80px);opacity:0;pointer-events:none;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);max-width:260px}
.toast.show{transform:translateY(0);opacity:1}
.ticon{font-size:22px;flex-shrink:0}
.ttxt{font-size:12px;font-weight:600;color:#ecfdf5;line-height:1.4}
.tsub{font-size:10px;color:rgba(236,253,245,.7);margin-top:1px}

/* ── EMPTY ── */
.empty{padding:40px;text-align:center;color:var(--t4);font-family:"JetBrains Mono",monospace;font-size:12px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .stats{grid-template-columns:repeat(3,1fr)}.sc.dc{grid-column:1/-1}
  .pi{grid-template-columns:22px 20px 1fr 48px 26px;gap:4px}.psrc{display:none}
  .months{padding:8px}.hero-title{font-size:26px}
}
</style>
</head>
<body>
<!-- PARTICLES -->
<div id="particles"></div>

<div class="app">
<!-- HERO -->
<div class="hero">
  <div class="hero-glow"></div>
  <div class="eyebrow">⚡ DSA QUEST · 840 PROBLEMS · 6 MONTHS</div>
  <h1 class="hero-title">Crack Every DSA Interview</h1>
  <p class="hero-sub">5 problems/day · All major sheets combined · Click any problem to solve on LeetCode</p>

  <div class="xp-wrap">
    <div class="xp-row">
      <span class="xp-lbl">⚔️ XP PROGRESS</span>
      <span class="xp-val" id="xp-txt">0 / 840 XP</span>
    </div>
    <div class="xp-track">
      <div class="xp-fill" id="xp-bar" style="width:0%"></div>
      <div class="xp-dot" id="xp-dot" style="right:-6px"></div>
    </div>
  </div>

  <div class="stats">
    <div class="sc tc"><div class="sc-num" id="s-done">0</div><div class="sc-lbl">🏆 Solved</div></div>
    <div class="sc ec"><div class="sc-num" id="s-easy">0</div><div class="sc-lbl">🟢 Easy</div></div>
    <div class="sc mc"><div class="sc-num" id="s-med">0</div><div class="sc-lbl">🟡 Medium</div></div>
    <div class="sc hc"><div class="sc-num" id="s-hard">0</div><div class="sc-lbl">🔴 Hard</div></div>
    <div class="sc dc"><div class="sc-num" id="s-day">0</div><div class="sc-lbl">📅 Day</div></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="cgrp">
    <button class="fb on" onclick="setF('all',this)">All</button>
    <button class="fb" onclick="setF('m1',this)">M1</button>
    <button class="fb" onclick="setF('m2',this)">M2</button>
    <button class="fb" onclick="setF('m3',this)">M3</button>
    <button class="fb" onclick="setF('m4',this)">M4</button>
    <button class="fb" onclick="setF('m5',this)">M5</button>
    <button class="fb" onclick="setF('m6',this)">M6</button>
  </div>
  <div class="csep"></div>
  <div class="cgrp">
    <button class="fb ef" onclick="setF('easy',this)">🟢 Easy</button>
    <button class="fb mf" onclick="setF('med',this)">🟡 Med</button>
    <button class="fb hf" onclick="setF('hard',this)">🔴 Hard</button>
  </div>
  <div class="csep"></div>
  <div class="cgrp">
    <button class="fb sf" onclick="setF('done',this)">✅ Solved</button>
    <button class="fb uf" onclick="setF('undone',this)">⬜ Todo</button>
  </div>
  <div class="csep"></div>
  <div class="sw">
    <span class="sico">🔍</span>
    <input class="si" id="srch" type="text" placeholder="Search 840 problems..." oninput="doSearch()">
  </div>
  <span class="result-count" id="rc"></span>
</div>

<!-- MONTHS -->
<div class="months" id="root"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="ticon" id="ticon">🎉</div>
  <div><div class="ttxt" id="ttxt">Solved!</div><div class="tsub" id="tsub"></div></div>
</div>

<script>
const M=[
{id:'m1',num:'01',name:'Month 1 — Arrays, Strings, Linked List, Stack',badge:'Foundations',bc:'rgba(124,111,247,.15)',bt:'#a78bfa',bar:'#7c6ff7',weeks:[
{name:'Week 1 — Array Basics & Patterns',day:'Day 1–7',topics:['Arrays','Prefix Sum','Sorting'],probs:[
{id:'1',n:'Two Sum',d:'easy',s:'NeetCode',lc:'two-sum'},
{id:'2',n:'Best Time to Buy and Sell Stock',d:'easy',s:'NeetCode',lc:'best-time-to-buy-and-sell-stock'},
{id:'3',n:'Contains Duplicate',d:'easy',s:'NeetCode',lc:'contains-duplicate'},

{id:'6',n:'Move Zeroes',d:'easy',s:'Apna College',lc:'move-zeroes'},
{id:'7',n:'Running Sum of 1D Array',d:'easy',s:'Shradha',lc:'running-sum-of-1d-array'},
{id:'8',n:'Find Pivot Index',d:'easy',s:'Striver',lc:'find-pivot-index'},
{id:'9',n:'Range Sum Query Immutable',d:'easy',s:'Babbar',lc:'range-sum-query-immutable'},
{id:'10',n:'Subarray Sum Equals K',d:'med',s:'Striver',lc:'subarray-sum-equals-k'},
{id:'11',n:'Set Matrix Zeroes',d:'med',s:'Striver',lc:'set-matrix-zeroes'},
{id:'12',n:'Spiral Matrix',d:'med',s:'Striver',lc:'spiral-matrix'},
{id:'13',n:'Rotate Image',d:'med',s:'NeetCode',lc:'rotate-image'},
{id:'14',n:'Find the Duplicate Number',d:'med',s:'NeetCode',lc:'find-the-duplicate-number'},
{id:'15',n:'Pascal\'s Triangle',d:'easy',s:'Striver',lc:'pascals-triangle'},
{id:'16',n:'Sort Colors (Dutch Flag)',d:'med',s:'Striver',lc:'sort-colors'},
{id:'17',n:'Merge Sorted Array',d:'easy',s:'Apna College',lc:'merge-sorted-array'},
{id:'18',n:'Remove Duplicates from Sorted Array',d:'easy',s:'NeetCode',lc:'remove-duplicates-from-sorted-array'},

// ── STATE ──
let done={};
try{done=JSON.parse(localStorage.getItem('dsa_final')||'{}');}catch(e){}
function save(){try{localStorage.setItem('dsa_final',JSON.stringify(done));}catch(e){}}

let curF='all', srchV='';

// ── MONTH CONFIG ──
const MCFG={
  m1:{icon:'📚',bg:'linear-gradient(135deg,#7c3aed,#4f46e5)',color:'#a78bfa',shadow:'rgba(124,58,237,.4)'},
  m2:{icon:'🌲',bg:'linear-gradient(135deg,#0891b2,#0e7490)',color:'#38bdf8',shadow:'rgba(8,145,178,.4)'},

};

// ── PARTICLES ──
function spawnParticles(){
  const c=document.getElementById('particles');
  const colors=['#a78bfa','#38bdf8','#10b981','#f59e0b','#f472b6'];
  for(let i=0;i<28;i++){
    const d=document.createElement('div');
    d.className='p-dot';
    const sz=Math.random()*3+1;
    d.style.cssText=`
      width:${sz}px;height:${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${Math.random()*10}s;
      animation-name:floatP;
    `;
    c.appendChild(d);
  }
}

// ── STATS UPDATE ──
function updateStats(){
  let tot=0,e=0,m=0,h=0;
  M.forEach(mo=>mo.weeks.forEach(w=>w.probs.forEach(p=>{
    if(done[p.id]){tot++;if(p.d==='easy')e++;else if(p.d==='med')m++;else h++;}
  })));
  animNum('s-done',tot);animNum('s-easy',e);animNum('s-med',m);animNum('s-hard',h);
  const day=Math.floor(tot/5);
  animNum('s-day',day);
  const pct=Math.round(tot/840*100);
  document.getElementById('xp-txt').textContent=tot+' / 840 XP';
  document.getElementById('xp-bar').style.width=pct+'%';
  document.getElementById('xp-dot').style.right=(pct===0?'-6px':'calc('+pct+'% - 8px)');

  M.forEach(mo=>{
    let mt=0,md=0;
    mo.weeks.forEach(w=>w.probs.forEach(p=>{mt++;if(done[p.id])md++;}));
    const p2=mt?Math.round(md/mt*100):0;
    const rf=document.getElementById('rf-'+mo.id);
    const rp=document.getElementById('rp-'+mo.id);
    const rd=document.getElementById('rd-'+mo.id);
    if(rf){const circ=2*Math.PI*16;rf.style.strokeDashoffset=circ-(circ*p2/100);}
    if(rp)rp.textContent=p2+'%';
    if(rd)rd.textContent=md+'/'+mt;
    // week bars
    mo.weeks.forEach((w,wi)=>{
      let wd=0;w.probs.forEach(p=>{if(done[p.id])wd++;});
      const wf=document.getElementById('wf-'+mo.id+'_'+wi);
      const wt=document.getElementById('wt-'+mo.id+'_'+wi);
      if(wf)wf.style.width=(w.probs.length?Math.round(wd/w.probs.length*100):0)+'%';
      if(wt)wt.textContent=wd+'/'+w.probs.length;
    });
  });
}

let numTimers={};
function animNum(id,to){
  if(numTimers[id])clearInterval(numTimers[id]);
  const el=document.getElementById(id);if(!el)return;
  const from=parseInt(el.textContent)||0;
  if(from===to){el.textContent=to;return;}
  const step=Math.ceil(Math.abs(to-from)/12);
  let cur=from;
  numTimers[id]=setInterval(()=>{
    cur+=to>from?step:-step;
    if((to>from&&cur>=to)||(to<from&&cur<=to)){cur=to;clearInterval(numTimers[id]);}
    el.textContent=cur;
  },30);
}

// ── SOLVE TOGGLE ──
const milestones=[10,25,50,100,150,200,300,420,500,600,700,840];
let toastTimer=null;
function showToast(icon,txt,sub){
  const t=document.getElementById('toast');
  document.getElementById('ticon').textContent=icon;
  document.getElementById('ttxt').textContent=txt;
  document.getElementById('tsub').textContent=sub;
  t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

function toggleSolve(pid,diff,name,lc){
  const wasDone=done[pid];
  done[pid]=!done[pid];
  save();
  // Update UI
  const chk=document.getElementById('c-'+pid);
  const pn=document.getElementById('n-'+pid);
  const row=document.getElementById('r-'+pid);
  if(chk)chk.classList.toggle('done',done[pid]);
  if(pn)pn.classList.toggle('done',done[pid]);
  if(row){row.dataset.done=done[pid]?'1':'0';row.classList.toggle('solved',done[pid]);}
  updateStats();
  applyF();
  // Toast
  if(done[pid]&&!wasDone){
    const tot=Object.values(done).filter(Boolean).length;
    const msgs={easy:['Easy one! 🌱','Warm up done!'],med:['Medium crushed! 💪','Pattern spotted!'],hard:['Hard beast tamed! 🔥','Legendary solve!']};
    const [icon,sub]=[{easy:'✅',med:'🎯',hard:'🔥'}[diff]||'✅',(msgs[diff]||['Done!',''])[1]];
    if(milestones.includes(tot))showToast('🎉',`${tot} Problems Solved!`,`You're on fire! Keep going!`);
    else showToast(icon,name.length>28?name.slice(0,28)+'…':name,sub);
  }
}

// ── CLICK HANDLER: mark done + open link ──
function handleProbClick(e,pid,diff,name,lc,isGfg){
  // Always mark solved on click
  if(!done[pid]){
    toggleSolve(pid,diff,name,lc);
  }
  // Open link in new tab
  if(lc){
    const url=isGfg?lc:`https://leetcode.com/problems/${lc}/`;
    window.open(url,'_blank','noopener');
  }
}

// ── FILTERS ──
function applyF(){
  srchV=document.getElementById('srch').value.toLowerCase().trim();
  let vis=0;
  document.querySelectorAll('.pi').forEach(row=>{
    const mid=row.dataset.mid,diff=row.dataset.diff,name=row.dataset.name,isDone=row.dataset.done==='1';
    let show=true;
    if(curF==='easy'&&diff!=='easy')show=false;
    if(curF==='med'&&diff!=='med')show=false;
    if(curF==='hard'&&diff!=='hard')show=false;
    if(curF==='done'&&!isDone)show=false;
    if(curF==='undone'&&isDone)show=false;
    if(curF.startsWith('m')&&mid!==curF)show=false;
    if(srchV&&!name.includes(srchV))show=false;
    row.classList.toggle('hidden',!show);
    if(show)vis++;
  });
  const rc=document.getElementById('rc');
  if(rc)rc.textContent=srchV||curF!=='all'?vis+' results':'';
  // Auto-expand all months when searching
  if(srchV){
    M.forEach(mo=>{
      const mc=document.querySelector('.mc[data-id="'+mo.id+'"]');
      if(mc){mc.classList.add('open');}
      mo.weeks.forEach((_,wi)=>{
        const wb=document.getElementById('wb-'+mo.id+'_'+wi);
        if(wb)wb.classList.add('open');
      });
    });
  }
}
function doSearch(){applyF();}
function setF(v,btn){
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');curF=v;applyF();
}

// ── TOGGLE MONTH ──
function toggleMonth(id){
  const mc=document.querySelector('.mc[data-id="'+id+'"]');
  if(mc)mc.classList.toggle('open');
}
// ── TOGGLE WEEK ──
function toggleWeek(mid,wi){
  const wb=document.getElementById('wb-'+mid+'_'+wi);
  const wch=document.getElementById('wch-'+mid+'_'+wi);
  if(!wb)return;
  const open=wb.classList.contains('open');
  wb.classList.toggle('open');
  if(wch)wch.classList.toggle('open',!open);
}

// ── RENDER ──
function render(){
  const root=document.getElementById('root');root.innerHTML='';
  const circ=2*Math.PI*16;

  M.forEach((mo,mi)=>{
    const cfg=MCFG[mo.id]||{icon:'📖',bg:'#333',color:'#fff',shadow:'rgba(0,0,0,.3)'};
    let mt=0,md=0;
    mo.weeks.forEach(w=>w.probs.forEach(p=>{mt++;if(done[p.id])md++;}));
    const mpct=mt?Math.round(md/mt*100):0;
    const mcirc=circ;

    // Build weeks HTML
    const weeksHtml=mo.weeks.map((w,wi)=>{
      const wid=mo.id+'_'+wi;
      let wd=0;w.probs.forEach(p=>{if(done[p.id])wd++;});
      const wpct=w.probs.length?Math.round(wd/w.probs.length*100):0;

      const probsHtml=w.probs.map((p,pi)=>{
        const isExt=p.lc&&p.lc.startsWith('EXT:');
        const lcSlug=isExt?p.lc.slice(4):p.lc;
        const linkUrl=isExt?lcSlug:(p.lc?`https://leetcode.com/problems/${p.lc}/`:'');
        const linkLabel=isExt?'GFG':'LC';
        const linkClass=isExt?'gfg':'lc';
        const isDone=!!done[p.id];

        return `<div class="pi${isDone?' solved':''}" id="r-${p.id}"
          data-mid="${mo.id}" data-diff="${p.d}" data-name="${p.n.toLowerCase()}" data-done="${isDone?'1':'0'}"
          onclick="handleProbClick(event,'${p.id}','${p.d}',${JSON.stringify(p.n)},${JSON.stringify(lcSlug)},${isExt})"
          title="Click to solve on ${isExt?'GeeksForGeeks':'LeetCode'}">
          <span class="dn">${String(pi+1).padStart(2,'0')}</span>
          <div class="chk${isDone?' done':''}" id="c-${p.id}"></div>
          <span class="pn${isDone?' done':''}" id="n-${p.id}">${p.n}</span>
          <span class="psrc">${p.s}</span>
          <span class="diff ${p.d}">${p.d}</span>
          ${linkUrl?`<a class="plink ${linkClass}" href="${linkUrl}" target="_blank" rel="noopener"
            onclick="event.stopPropagation();if(!done['${p.id}']){toggleSolve('${p.id}','${p.d}',${JSON.stringify(p.n)},'${lcSlug}')}"
            title="Open on ${isExt?'GeeksForGeeks':'LeetCode'}">${linkLabel}</a>`:'<span></span>'}
        </div>`;
      }).join('');

      return `<div class="wc">
        <div class="wh" onclick="toggleWeek('${mo.id}',${wi})">
          <div class="wleft">
            <div class="wname">${w.name}</div>
            <div class="wchips">
              <span class="chip dchip">${w.day}</span>
              ${w.topics.map(t=>`<span class="chip">${t}</span>`).join('')}
            </div>
          </div>
          <div class="wright">
            <div class="wprog">
              <div class="wpt" id="wt-${wid}">${wd}/${w.probs.length}</div>
              <div class="wtrack"><div class="wfill" id="wf-${wid}" style="width:${wpct}%"></div></div>
            </div>
            <span class="wchev" id="wch-${wid}">⌄</span>
          </div>
        </div>
        <div class="wbody" id="wb-${wid}">${probsHtml}</div>
      </div>`;
    }).join('');

    const mc=document.createElement('div');
    mc.className='mc';mc.dataset.id=mo.id;
    mc.innerHTML=`
      <div class="mh" onclick="toggleMonth('${mo.id}')">
        <div class="micon" style="background:${cfg.bg};--mi-shadow:${cfg.shadow};box-shadow:0 4px 16px ${cfg.shadow}">${cfg.icon}</div>
        <div class="minfo">
          <div class="mname">${mo.name}
            <span class="mbadge" style="background:${mo.bc};color:${cfg.color};border-color:${cfg.color}40">${mo.badge}</span>
          </div>
          <div class="mmeta">${mo.weeks.length} weeks · ${mt} problems · Day ${mi*28+1}–${(mi+1)*28}</div>
        </div>
        <div class="mright">
          <div class="mring">
            <svg width="48" height="48" viewBox="0 0 40 40">
              <circle class="rb" cx="20" cy="20" r="16"/>
              <circle class="rf" id="rf-${mo.id}" cx="20" cy="20" r="16"
                stroke="${cfg.color}"
                stroke-dasharray="${mcirc.toFixed(1)}"
                stroke-dashoffset="${(mcirc-(mcirc*mpct/100)).toFixed(1)}"/>
            </svg>
            <div class="rinner">
              <span class="rpct" id="rp-${mo.id}" style="color:${cfg.color}">${mpct}%</span>
              <span class="rdone" id="rd-${mo.id}">${md}/${mt}</span>
            </div>
          </div>
          <div class="mtog">⌄</div>
        </div>
      </div>
      <div class="mb">${weeksHtml}</div>
    `;
    root.appendChild(mc);
  });
  updateStats();
}

spawnParticles();
